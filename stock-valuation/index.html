<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 가치평가 도구</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header>
      <h1>📊 주식 가치평가 도구</h1>
      <p>5년간 PER/PBR/PSR 데이터를 입력하고 지표 분석 및 표준편차 밴드를 확인하세요</p>
    </header>

    <div class="main-grid">
      <!-- Sidebar: 저장된 티커 목록 -->
      <aside class="sidebar">
        <h3>💾 저장된 티커</h3>
        <div id="ticker-list"></div>
      </aside>

      <!-- Main Content -->
      <main class="content">
        <!-- 티커명 입력 -->
        <div class="form-section">
          <h2>기본 정보</h2>
          <div class="form-group">
            <label for="ticker-input">티커명 / 종목명</label>
            <input
              type="text"
              id="ticker-input"
              placeholder="예) AAPL (미국주식) 또는 수동 입력"
              maxlength="20"
              title="미국 주식: AAPL, GOOGL, TSLA 등
한국 주식: 수동 입력 권장"
            >
            <small style="color: #666; margin-top: 5px; display: block;">
              💡 팁: 미국 주식(AAPL, GOOGL 등) 입력 후 탭/엔터를 누르면 Finnhub에서 자동으로 현재 PER/PBR 데이터를 가져옵니다.
            </small>
          </div>
          <div class="form-group">
            <label>컨센서스 사용</label>
            <label class="toggle-switch">
              <input type="checkbox" id="consensus-toggle">
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <!-- 과거 데이터 입력 테이블 -->
        <div class="form-section">
          <h2>과거 데이터 (5년)</h2>
          <table class="data-table">
            <thead>
              <tr>
                <th>지표</th>
                <th id="year-0"></th>
                <th id="year-1"></th>
                <th id="year-2"></th>
                <th id="year-3"></th>
                <th id="year-4"></th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="row-label">PER</td>
                <td><input type="number" id="per-0" step="0.01" min="0"></td>
                <td><input type="number" id="per-1" step="0.01" min="0"></td>
                <td><input type="number" id="per-2" step="0.01" min="0"></td>
                <td><input type="number" id="per-3" step="0.01" min="0"></td>
                <td><input type="number" id="per-4" step="0.01" min="0"></td>
              </tr>
              <tr>
                <td class="row-label">PBR</td>
                <td><input type="number" id="pbr-0" step="0.01" min="0"></td>
                <td><input type="number" id="pbr-1" step="0.01" min="0"></td>
                <td><input type="number" id="pbr-2" step="0.01" min="0"></td>
                <td><input type="number" id="pbr-3" step="0.01" min="0"></td>
                <td><input type="number" id="pbr-4" step="0.01" min="0"></td>
              </tr>
              <tr>
                <td class="row-label">PSR</td>
                <td><input type="number" id="psr-0" step="0.01" min="0"></td>
                <td><input type="number" id="psr-1" step="0.01" min="0"></td>
                <td><input type="number" id="psr-2" step="0.01" min="0"></td>
                <td><input type="number" id="psr-3" step="0.01" min="0"></td>
                <td><input type="number" id="psr-4" step="0.01" min="0"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 현재값 입력 -->
        <div class="form-section">
          <h2>현재값</h2>
          <table class="data-table">
            <tbody>
              <tr>
                <td class="row-label">현재 PER</td>
                <td><input type="number" id="currentPer" step="0.01" min="0"></td>
              </tr>
              <tr>
                <td class="row-label">현재 PBR</td>
                <td><input type="number" id="currentPbr" step="0.01" min="0"></td>
              </tr>
              <tr>
                <td class="row-label">현재 PSR</td>
                <td><input type="number" id="currentPsr" step="0.01" min="0"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 컨센서스 입력 (토글 ON 시만 표시) -->
        <div class="form-section">
          <h2>컨센서스 (선택)</h2>
          <table class="data-table">
            <tbody>
              <tr data-consensus-row style="display: none;">
                <td class="row-label">컨센서스 PER</td>
                <td><input type="number" id="consensusPer" step="0.01" min="0"></td>
              </tr>
              <tr data-consensus-row style="display: none;">
                <td class="row-label">컨센서스 PBR</td>
                <td><input type="number" id="consensusPbr" step="0.01" min="0"></td>
              </tr>
              <tr data-consensus-row style="display: none;">
                <td class="row-label">컨센서스 PSR</td>
                <td><input type="number" id="consensusPsr" step="0.01" min="0"></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- 버튼 그룹 -->
        <div class="button-group">
          <button id="save-btn" class="btn-primary">💾 저장</button>
          <button id="export-btn" class="btn-secondary">📥 엑셀 다운로드</button>
        </div>

        <!-- 차트 섹션 -->
        <div class="charts-section">
          <h2>지표 분석 차트</h2>
          <div class="charts-grid">
            <div class="chart-container">
              <canvas id="chart-per"></canvas>
            </div>
            <div class="chart-container">
              <canvas id="chart-pbr"></canvas>
            </div>
            <div class="chart-container">
              <canvas id="chart-psr"></canvas>
            </div>
          </div>
        </div>

        <!-- 결과 섹션 -->
        <div class="results-section">
          <h2>통계 결과</h2>
          <div class="results-grid">
            <div id="result-per" class="result-card"></div>
            <div id="result-pbr" class="result-card"></div>
            <div id="result-psr" class="result-card"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
